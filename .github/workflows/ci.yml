name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:
  # Allow release workflow to reuse CI gates before publishing.
  workflow_call:

env:
  BUN_VERSION: '1.3.9'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-install
        with:
          bun-version: ${{ env.BUN_VERSION }}
          cache-prefix: ${{ runner.os }}-bun
      - name: Lint
        run: bun run lint
      - name: Check formatting
        run: bun run format
      - name: Type check
        run: bun run typecheck
      - name: Shell tests
        run: bun run test:shell
      # Blocking: the dependency tree that actually ships. It is one package
      # (croner), so a finding here is real and actionable.
      - name: Security audit (production)
        run: bun audit --prod
      # Non-blocking: build-time only. semantic-release pulls ~66 advisories
      # through conventional-changelog (handlebars, picomatch, sigstore) that
      # `bun update` cannot resolve, because they are pinned inside its tree.
      # None of it reaches the compiled binary, which bundles index.ts and src
      # only. Blocking on them left CI red from 2026-02-28 onward, which is
      # worse than not gating: a permanently failing pipeline is one nobody
      # reads. Reported so drift stays visible, and so a genuinely new
      # advisory is not hidden by the standing noise.
      - name: Security audit (dev, informational)
        continue-on-error: true
        run: bun audit

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-install
        with:
          bun-version: ${{ env.BUN_VERSION }}
          cache-prefix: ${{ runner.os }}-bun
      - name: Run tests with coverage
        shell: bash
        run: |
          set -eo pipefail
          bun test --coverage
