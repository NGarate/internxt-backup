# Bun configuration for internxt-backup

telemetry = false

[test]
# Enforce coverage threshold natively in Bun.
#
# Only lines is gated. The remaining code is overwhelmingly pure functions, so
# this rises to 0.85 once the engine and config layers land — see
# docs/roadmap.md, Phase 12.
coverageThreshold = { lines = 0.7, functions = 0, statements = 0, branches = 0 }

[install]
# Using text lockfile instead of binary for better version control compatibility
saveTextLockfile = true
registry = "https://registry.npmjs.org/"
